name: deploy-cyberpcangel

# Publishes cyprty's browser page, public and not login-gated:
#   https://cyberpcangel.com/cyprty/   the stock arigl-web page running share/cyprty/main.ari
# deploy/cyberpcangel/README.md has the whole chain and the one-time setup.
#
# The page is the single-threaded arigl-web package from cvcpkg.org, as a site installs it: the
# stock, packaged host, never a libcvc build. stage.sh refuses a package that cannot run a
# conference (no url_env page config, or no WebSocket transport).
#
# It runs on catx-03 (label cvcpkg-prod: the cy-pca org runner, catx-03-cy-pca, one job at a time),
# which holds the cyberpcangel deploy key. The key's forced command on catx-00 maps the fixed
# action `deploy-cyprty` to /root/cyprty-deploy.sh in the cyberpcangel instance; the client never
# names a path. No pull_request trigger: a pull request must not reach the runner that holds the
# key.
#
# By hand only, for now (Actions -> deploy-cyberpcangel -> Run workflow): until cvcpkg.org has an
# arigl-web that runs a conference, a run stops at the stage step. Once it does, add the
# workflow_run trigger (after `ci` succeeds on a push to main), as cy-pca/nicotina has.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'The cyprty branch, tag or commit whose documents to publish'
        type: string
        default: 'main'
      force:
        description: 'Publish even if nothing moved since the live build'
        type: boolean
        default: false

concurrency:
  group: deploy-cyberpcangel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, cvcpkg-prod]
    timeout-minutes: 30
    env:
      # Where arigl-web goes (the same prefix cy-pca/nicotina's deploy installs it into).
      WEB_PREFIX: /home/github-runner/cvc-wasm/deps-wasm
      DEPLOY_KEY: /home/github-runner/.ssh/id_ed25519_cyberpcangel_deploy
      DOCS_REF: ${{ inputs.ref || 'main' }}
    steps:
      - name: Checkout the deploy scripts
        uses: actions/checkout@v4
        with:
          path: cyprty

      - name: Checkout the documents (${{ env.DOCS_REF }})
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DOCS_REF }}
          path: docs-src

      # The newest arigl-web; one already in the prefix is a no-op.
      - name: Install arigl-web (cvcpkg)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "cvcpkg: $(command -v cvcpkg) $(cvcpkg --version)"
          mkdir -p "$WEB_PREFIX"
          cvcpkg install arigl-web --platform wasm --arch wasm32 --prefix "$WEB_PREFIX" \
            --config release --link static --no-fallback-to-source 2>&1 | tail -3

      - name: Has anything moved?
        id: check
        run: |
          # What a payload depends on: the arigl-web bundle (its version and hash, from the
          # install's lockfile), the documents, and the files that shape the payload (the page
          # config, the staging script and this workflow).
          web=$(awk '/^- name: / {n = $3}
                     n == "arigl-web" && $1 == "version:" {v = $2}
                     n == "arigl-web" && $1 == "sha256:" {h = substr($2, 1, 16)}
                     END {if (v && h) print v "@" h}' "$WEB_PREFIX/share/libcvc-deps/lockfile.yaml")
          [ -n "$web" ] || { echo "::error::no arigl-web in $WEB_PREFIX's lockfile"; exit 1; }
          shaping=$(git -C cyprty ls-tree HEAD -- deploy/cyberpcangel/ariadne.config.json \
                      deploy/cyberpcangel/stage.sh .github/workflows/deploy-cyberpcangel.yml \
                      | sha256sum | cut -c1-16)
          inputs="arigl-web=$web docs=$(git -C docs-src rev-parse HEAD:share/cyprty) deploy=$shaping"
          fp=$(printf '%s' "$inputs" | sha256sum | cut -c1-16)
          echo "built_from=$fp $inputs cyprty=$(git -C docs-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          live=$(python3 -I -c 'import urllib.request as u
          try: print(u.urlopen("https://cyberpcangel.com/cyprty/.built-from", timeout=30).read().decode().split()[0])
          except Exception: print("none")')
          echo "this build $fp, live $live ($inputs)"
          if [ "$fp" = "$live" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "::notice::nothing moved since the live build ($fp)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage
        if: steps.check.outputs.run == 'true'
        run: |
          rm -rf payload
          bash cyprty/deploy/cyberpcangel/stage.sh "$WEB_PREFIX/share/arigl-web" docs-src/share/cyprty \
            payload "${{ steps.check.outputs.built_from }}"

      - name: Publish to cyberpcangel.com
        if: steps.check.outputs.run == 'true'
        run: |
          tar czf - -C payload cyprty \
            | ssh -i "$DEPLOY_KEY" -o BatchMode=yes -o ConnectTimeout=20 tfx@catx-00.tx.wtf deploy-cyprty

      - name: Verify live
        if: steps.check.outputs.run == 'true'
        run: python3 -I cyprty/deploy/cyberpcangel/verify.py payload
